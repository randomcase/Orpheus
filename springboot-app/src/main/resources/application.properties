spring.application.name=orpheus-research
server.port=8080

spring.datasource.url=jdbc:h2:mem:orpheusdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info,metrics
management.info.env.enabled=true
info.app.name=Orpheus Diachronic Research Atlas
info.app.span=600 BCE to 2026 CE

orpheus.data-dir=../data
orpheus.research-dir=../research
orpheus.reports-dir=../reports
orpheus.suite-config=../config/google-suite.json
orpheus.go-engine.url=http://127.0.0.1:8091
orpheus.go-engine.auto-start=true
orpheus.go-engine.binary-path=../bin/orpheus-engine.exe
